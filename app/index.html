<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: the saved choice, else the system setting -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem("theme") } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polina's Portfolio</title>
    <meta content="Polina's Portfolio" property="og:title" />
    <meta content="./img/OpenGraph_img.png" property="og:image" />
    <link href="./img/favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link
      href="https://fonts.gstatic.com"
      rel="preconnect"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Yandex Metrica, Varioqub and Hotjar load only after consent: src/analytics/trackers.ts -->
  </body>
</html>
