<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: the saved choice, else the system setting -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem("theme") } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polina's Portfolio</title>
    <meta name="description" content="Polina, a holistic product designer who speaks code and data. From research to shipped, measured product." />
    <link rel="canonical" href="https://apoly.pro/" />

    <!-- Link previews (LinkedIn, Telegram, Slack, X). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
